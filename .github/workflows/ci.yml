name: ci

on:
  push:
    branches-ignore:
      - preview
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  # 与 build-release / build-validation 使用同一 Flutter commit。
  FLUTTER_VERSION: c97838627ff5c275e9788839d427ab03eb1dfa01

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: main
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install SQLite for database tests
        if: matrix.check == 'test'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        if: matrix.check == 'analyze'
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Test
        if: matrix.check == 'test'
        run: flutter test --no-pub --reporter expanded
